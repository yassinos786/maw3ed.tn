name: Maw3ed.tn CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backend-ci:
    name: Backend (Spring Boot 3 + Java 21)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run unit tests (Maven)
        run: |
          cd backend
          mvn test --no-transfer-progress

      - name: Package Spring Boot JAR
        run: |
          cd backend
          mvn package -DskipTests --no-transfer-progress

  triage-service-ci:
    name: Triage Service (FastAPI + Python 3.11)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'triage_service/requirements.txt'

      - name: Install dependencies
        run: |
          cd triage_service
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests (Pytest)
        run: |
          cd triage_service
          pytest -v

  frontend-ci:
    name: Frontend (Angular 22 + Node 24)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install npm packages
        run: |
          cd frontend
          npm install

      - name: Build Angular production bundle
        run: |
          cd frontend
          npm run build -- --base-href /maw3ed.tn/

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/frontend/browser/

  docker-check:
    name: Docker Compose Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate docker-compose.yml
        run: |
          docker compose config

  deploy-frontend:
    name: Deploy Frontend to GitHub Pages
    needs: [backend-ci, triage-service-ci, frontend-ci, docker-check]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: public-dist

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public-dist
          force_orphan: true
