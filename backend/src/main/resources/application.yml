server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: maw3ed-api

  data:
    mongodb:
      uri: mongodb://${MONGO_HOST:localhost}:${MONGO_PORT:27017}/${MONGO_DB:maw3ed_db}
      auto-index-creation: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

application:
  security:
    jwt:
      # Cle de chiffrement HMAC 256 bits (Hex 64 cars)
      secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
      access-token-expiration-ms: 86400000 # 24 heures
      refresh-token-expiration-ms: 604800000 # 7 jours
  cors:
    allowed-origins:
      - "http://localhost:4200"
      - "https://maw3ed.tn"
  triage-service:
    enabled: true
    url: ${TRIAGE_SERVICE_URL:http://localhost:8000}
    connect-timeout-ms: 3000
    read-timeout-ms: 5000

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

logging:
  level:
    root: INFO
    tn.maw3ed: DEBUG
    org.springframework.security: INFO
    org.springframework.data.mongodb: INFO
